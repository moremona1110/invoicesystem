<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceFlow | Create Invoice</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="container" style="max-width: 800px;">
        <header>
            <div class="logo">
                <h1>Create New Invoice</h1>
                <p style="font-size: 0.8rem; color: var(--text-muted);">Fill in the details to generate an invoice</p>
            </div>
            <div class="actions">
                <a href="index.html" class="btn btn-outline" style="padding: 0.5rem;">
                    <i data-lucide="arrow-left"></i> Home
                </a>
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </header>

        <main>
            <form id="createInvoiceForm" class="card">
                <div class="grid">
                    <div class="form-group">
                        <label for="invoiceNo">Invoice Number</label>
                        <input type="number" id="invoiceNo" class="form-control" required placeholder="e.g. 1001">
                    </div>
                    <div class="form-group">
                        <label for="estimatedId">Estimated ID</label>
                        <input type="number" id="estimatedId" class="form-control" required placeholder="e.g. 5001">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label for="chainId">Chain ID</label>
                        <input type="number" id="chainId" class="form-control" required placeholder="e.g. 101">
                    </div>
                    <div class="form-group">
                        <label for="emailId">Customer Email</label>
                        <input type="email" id="emailId" class="form-control" placeholder="customer@example.com">
                    </div>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label for="dateOfService">Date of Service</label>
                        <input type="date" id="dateOfService" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="deliveryDetails">Delivery Details</label>
                        <input type="text" id="deliveryDetails" class="form-control"
                            placeholder="e.g. UPS Tracking #123">
                    </div>
                </div>

                <div class="form-group">
                    <label for="serviceDetails">Service Details</label>
                    <textarea id="serviceDetails" class="form-control" rows="3"
                        placeholder="Describe the service provided..."></textarea>
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label for="qty">Quantity</label>
                        <input type="number" id="qty" class="form-control" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label for="costPerQty">Cost Per Unit</label>
                        <input type="number" id="costPerQty" class="form-control" step="0.01" value="0.00">
                    </div>
                </div>

                <div class="form-group"
                    style="background: var(--bg-color); padding: 1rem; border-radius: 0.5rem; border: 1px dashed var(--border-color);">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600;">Total Amount (Inc. GST 18%):</span>
                        <span id="calculatedTotal"
                            style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color);">₹0.00</span>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                    <button type="reset" class="btn btn-outline" style="padding: 0.5rem 1.5rem;">Reset</button>
                    <button type="submit" class="btn btn-primary" style="padding: 0.5rem 2rem;">
                        <i data-lucide="save"></i> Save Invoice
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
